[tool.poetry]
name = "spotiflirtatious"
version = "0.1.0"
description = "A live Spotify dashboard that displays your currently playing track, album art, and artist info."
authors = ["Harry Mancinelli"]
readme = "README.md"
keywords = ["spotify", "dash", "dashboard", "music", "visualisation"]

[tool.poetry.dependencies]
python = "^3.13"
spotipy = "^2.25.0"
pandas = "^2.2.3"
dash = "^2.18.2"
dash-bootstrap-components = "^1.7.1"
plotly = "^6.0.0"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
dash-daq = "^0.5.0"
dash-player = "^1.1.0"
pillow = "^11.1.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
